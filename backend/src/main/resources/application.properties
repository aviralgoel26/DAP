spring.application.name=backend
server.port=5050

# DAP Configuration
template.storage.path=../templates
generated.storage.path=../generated
upload.storage.path=../uploads

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs

# MongoDB Atlas — credentials via environment variables only, never hardcoded
# Set MONGODB_URI in your local environment or on Render
spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.database=${MONGODB_DATABASE:dap}